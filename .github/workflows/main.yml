name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: passport-photo-studio-apk
    steps:
      - uses: actions/checkout@v4

      - name: Verify project layout
        run: |
          ls -la
          for f in package.json capacitor.config.json www/index.html; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Generate Android project and sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: passport-photo-studio-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Passport-Photo-Studio-APK
          path: passport-photo-studio-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
